services:
  postgres:
    container_name: postgres-sql
    image: postgres
    environment:
      POSTGRES_USER: taoufik
      POSTGRES_PASSWORD: 12345@
      POSTGRES_DB: library_book
    ports:
      - "5432:5432"
#    volumes:
#      - postgres:/var/lib/postgresql/data
    networks:
      - library-network
    restart: unless-stopped

  mail-dev:
    container_name: mail-dev
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"

networks:
  library-network:
    driver: bridge
